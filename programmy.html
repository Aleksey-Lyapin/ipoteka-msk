      var j = JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1));
      if (j.status !== 'ok') throw new Error('gviz ' + j.status);
      return j.table.rows.map(function (row) { return (row.c || []).map(function (c) { return c ? c.v : null; }); });
    });
  }

  /* ---------- Форматирование ---------- */
  var nf0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
  var nfp = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
  function rub(v) { return v == null ? '—' : nf0.format(Math.round(v)) + ' ₽'; }
  function pct(v) { return v == null ? '—' : nfp.format(+(v * 100).toPrecision(15)) + '%'; }
  function plural(n, a, b, c) { var m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c); }
  function years(y) { if (y == null) return '—'; return nfp.format(y) + ' ' + (Number.isInteger(y) ? plural(y, 'год', 'года', 'лет') : 'года'); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ---------- Вывод ---------- */
  var D = null, kidsFilter = 'один ребёнок', typeFilter = ''; // typeFilter '' — все типы; у детей «Все» нет
  var groupsEl = document.getElementById('pl-groups'), typeEl = document.getElementById('pl-type');

  function cols(type, multiProject) {
    var c = [
      ['Программа', function (p) { return esc(p.name); }],
      ['Ставка на льготный период', function (p) { return pct(p.r1); }],
      ['Ставка на основной период', function (p) { return pct(p.r2); }],
      ['Льготный период', function (p) { return p.grace ? years(p.grace) : 'нет'; }],
      ['Макс. срок', function (p) { return years(p.term); }],
      ['Мин. ПВ', function (p) { return pct(p.mpv); }],
      ['Мин. размер кредита', function (p) { return rub(p.minLoan); }],
      ['Лимит кредита', function (p) { return p.lim == null ? 'без лимита' : rub(p.lim); }]
    ];
    if (type === FAMILY) c.splice(1, 0, ['Количество детей', function (p) { return esc(p.kids || '—'); }]);
    if (multiProject) c.splice(1, 0, ['Проект', function (p) { return esc(p.projects.join(', ')); }]);
    return c;
  }

  function render() {
    var multi = D.projects.length > 1;
    if (!multi && D.projects.length) document.getElementById('pl-sub').textContent =
      'ЖК «' + D.projects[0] + '», Москва. Перечень ипотечных программ по типам ипотеки.';
    // Фильтр «Тип ипотеки»: Все + типы, по которым на листе есть программы
    if (typeFilter && D.types.indexOf(typeFilter) < 0) typeFilter = '';
    typeEl.innerHTML = [''].concat(D.types).map(function (t) {
      return '<button type="button" data-t="' + esc(t) + '" aria-pressed="' + (t === typeFilter) + '">' + (t ? esc(t) : 'Все') + '</button>';
    }).join('');
    var shownTypes = typeFilter ? [typeFilter] : D.types;
    groupsEl.innerHTML = shownTypes.map(function (type) {
      var all = D.list.filter(function (p) { return p.type === type; });
      var fam = type === FAMILY;
      var kidsList = [];
      if (fam) {
        all.forEach(function (p) { if (p.kids && kidsList.indexOf(p.kids) < 0) kidsList.push(p.kids); });
        kidsList.sort(function (a, b) { return kidsIdx(a) - kidsIdx(b); });
        if (kidsList.indexOf(kidsFilter) < 0) kidsFilter = kidsList.indexOf('один ребёнок') >= 0 ? 'один ребёнок' : (kidsList[0] || '');
      }
      var rows = fam && kidsFilter ? all.filter(function (p) { return p.kids === kidsFilter; }) : all;
      var c = cols(type, multi);
      var filter = fam ? '<div class="pl-filter"><span class="pl-label" id="pl-kids-l">Количество детей</span>' +
        '<div class="pl-pills" role="group" aria-labelledby="pl-kids-l" data-kids>' +
        kidsList.map(function (k) {
          return '<button type="button" data-k="' + esc(k) + '" aria-pressed="' + (k === kidsFilter) + '">' + esc(k) + '</button>';
        }).join('') + '</div></div>' : '';
      return '<section class="pl-card">' +
        '<div class="pl-head"><h3>' + esc(type) + '</h3><span class="pl-count">' + rows.length + ' ' + plural(rows.length, 'программа', 'программы', 'программ') + '</span></div>' +
        filter +
        (rows.length ? '<div class="pl-scroll"><table><thead><tr>' + c.map(function (x) { return '<th>' + x[0] + '</th>'; }).join('') + '</tr></thead><tbody>' +
          rows.map(function (p) { return '<tr>' + c.map(function (x) { return '<td data-l="' + x[0] + '">' + x[1](p) + '</td>'; }).join('') + '</tr>'; }).join('') +
          '</tbody></table></div>' : '<p class="pl-empty">Программ нет.</p>') +
        '</section>';
    }).join('');
  }

  groupsEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-kids] button[data-k]'); if (!b) return;
    kidsFilter = b.getAttribute('data-k'); render();
  });
  typeEl.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-t]'); if (!b) return;
    typeFilter = b.getAttribute('data-t'); render();
  });

  window.ProgramsList = { data: function () { return D; } };
  D = normalize(SNAPSHOT); render();

  if (CONFIG.liveData && window.fetch) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 10000);
    var s = ctrl ? ctrl.signal : undefined;
    Promise.all([gviz(CONFIG.programsSheet, 'A5:O400', s), gviz('Справочники', 'A4:F44', s)]).then(function (res) {
      clearTimeout(timer);
      var d = normalize({ programs: res[0], types: res[1].map(function (r) { return r[1]; }).filter(function (v) { return v; }) });
      if (d.list.length) { D = d; render(); }
    }).catch(function () { /* остаёмся на встроенной копии */ });
  }
})();
</script>

</body>
</html>
